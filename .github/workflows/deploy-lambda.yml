name: Deploy Lambda Function

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:  # Allows manual trigger of the workflow

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    permissions:
      id-token: write
      contents: read
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4  # Updated to latest version

      - name: Setup Node.js
        uses: actions/setup-node@v4  # Updated to latest version
        with:
          node-version: '22'
          cache: 'npm'  # Added caching for faster builds

      - name: Install dependencies
        run: npm ci  # Uses clean install instead of npm install
        
      - name: Run tests
        run: npm test  # Added testing step
        
      - name: Build the function
        run: npm run build
        
      - name: Create deployment package
        run: |
          zip -r function.zip . -x "*.git*" "node_modules/*" "test/*"
          
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4  # Updated to latest version
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}  # Using IAM role instead of access keys
          aws-region: 'ap-south-1'

      - name: Deploy to Lambda
        run: |
          aws lambda update-function-code \
            --function-name ${{ secrets.LAMBDA_FUNCTION_NAME }} \
            --zip-file fileb://function.zip

      - name: Verify deployment
        run: |
          aws lambda wait function-updated \
            --function-name ${{ secrets.LAMBDA_FUNCTION_NAME }}
