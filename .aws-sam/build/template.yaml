AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Globals:
  Function:
    MemorySize: 128
    Timeout: 30
    Runtime: nodejs20.x
  Api:
    Cors:
      AllowMethods: '''GET,POST,PUT,DELETE'''
      AllowHeaders: '''Content-Type'''
      AllowOrigin: '''*'''
Resources:
  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: reccelambdaiamrole
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Service: lambda.amazonaws.com
          Action: sts:AssumeRole
      ManagedPolicyArns:
      - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole

  MyHttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowMethods: ['GET', 'POST', 'PUT', 'DELETE']
        AllowHeaders: ['Content-Type']
        AllowOrigins: ['*']
           
  Function1:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: Function1
      Handler: function1/index.handler
      CodeUri: Function1
      Role:
        Fn::GetAtt:
        - LambdaExecutionRole
        - Arn
      Events:
        ApiEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref MyHttpApi
            Path: /{proxy+}
            Method: any
    Metadata:
      SamResourceId: Function1
  Function2:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: Function2
      Handler: function2/index.handler
      CodeUri: Function2
      Role:
        Fn::GetAtt:
        - LambdaExecutionRole
        - Arn
      Events:
        ApiEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref MyHttpApi
            Path: /{proxy+}
            Method: any
    Metadata:
      SamResourceId: Function2
  Function3:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: Function3
      Handler: function3/index.handler
      CodeUri: Function3
      Role:
        Fn::GetAtt:
        - LambdaExecutionRole
        - Arn
      Events:
        ApiEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref MyHttpApi
            Path: /{proxy+}
            Method: any
    Metadata:
      SamResourceId: Function3
  MyCommonLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: my-common-layer
      Description: Common dependencies layer
      ContentUri: ..\..\layers\my-common-layer
      CompatibleRuntimes:
      - nodejs20.x
      RetentionPolicy: Retain
Outputs:
  ApiEndpoint:
    Description: API Gateway endpoint URL
    Value:
      Fn::Sub: https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/dev/
