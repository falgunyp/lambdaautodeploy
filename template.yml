AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31

Resources:
  Function1:
    Type: 'AWS::Serverless::Function'
    Properties:
      Handler: function1/index.handler
      Runtime: nodejs22.x 
      CodeUri: functions/function1
      MemorySize: 128
      Timeout: 30
      #Environment:
      #  Variables:
          # Load environment variables from .env file
      Layers:
        - !GetAtt: MyCommonLayer.Arn

  Function1:
    Type: 'AWS::Serverless::Function'
    Properties:
      Handler: function1/index.handler
      Runtime: nodejs22.x 
      CodeUri: functions/function1
      MemorySize: 128
      Timeout: 30
      #Environment:
      #  Variables:
          # Load environment variables from .env file
      Layers:
        - !GetAtt: MyCommonLayer.Arn

