AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31

Parameters:
  Environment:
    Type: String
    Default: recce-dev
    AllowedValues:
      - recce-dev
      - recce-prod
    Description: Deployment environment (recce-dev or recce-prod)

Globals:
  Function:
    MemorySize: 128
    Timeout: 30
    Runtime: nodejs20.x
    Layers:
      - !Ref MyCommonLayer
    Environment:
      Variables:
        ENV: !Ref Environment
    Tags:
      Environment: !Ref Environment
      Project: RecceProject

Resources:
  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "reccelambdaiamrole-${Environment}"
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        - arn:aws:iam::715499049821:policy/SSMforLAMBDA

  MyHttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowMethods: ['GET', 'POST', 'PUT', 'DELETE']
        AllowHeaders: ['Content-Type']
        AllowOrigins: ['*']
      DefaultRouteSettings:
        ThrottlingBurstLimit: 100
        ThrottlingRateLimit: 50



  Function1:
    Type: 'AWS::Serverless::Function'
    Properties:
      FunctionName: !Sub "Function1-${Environment}"
      Handler: function1/index.handler
      CodeUri: functions/function1
      Role: !GetAtt LambdaExecutionRole.Arn
      Events:
        ApiEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref MyHttpApi
            Path: /function1
            Method: any

  Function2:
    Type: 'AWS::Serverless::Function'
    Properties:
      FunctionName: !Sub "Function2-${Environment}"
      Handler: function2/index.handler
      CodeUri: functions/function2
      Role: !GetAtt LambdaExecutionRole.Arn
      Events:
        ApiEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref MyHttpApi
            Path: /function2
            Method: any

  Function3:
    Type: 'AWS::Serverless::Function'
    Properties:
      FunctionName: !Sub "Function3-${Environment}"
      Handler: function3/index.handler
      CodeUri: functions/function3
      Role: !GetAtt LambdaExecutionRole.Arn
      Events:
        ApiEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref MyHttpApi
            Path: /function3
            Method: any

  MyCommonLayer:
    Type: 'AWS::Serverless::LayerVersion'
    Properties:
      LayerName: !Sub "my-common-layer-${Environment}"
      Description: Common dependencies layer with centralized .env
      ContentUri: layers/my-common-layer
      CompatibleRuntimes:
        - nodejs20.x
      LicenseInfo: 'MIT'
      RetentionPolicy: Retain

Outputs:
  HttpApiEndpoint:
    Description: API Gateway HTTP API endpoint URL
    Value: !Sub "https://${MyHttpApi}.execute-api.${AWS::Region}.amazonaws.com/"
