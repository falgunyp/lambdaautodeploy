    Type: 'AWS::Serverless::Function'
    Properties:
      Handler: function1/index.handler
      Runtime: nodejs22.x 
      CodeUri: functions/function1
      MemorySize: 128
      Timeout: 30
      #Environment:
      #  Variables:
          # Load environment variables from .env file
      Layers:
        - !GetAtt: MyCommonLayer.Arn

  MyCommonLayer:
